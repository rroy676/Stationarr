services:
  stationarr:
    build: .
    container_name: stationarr
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - stationarr_data:/app/data
      - scraper_shared:/app/data/scraper
      # Optional: enable only if you need Stationarr to control Docker-based scraper workflows.
      # WARNING: Mounting the Docker socket gives this container broad control over Docker on the host.
      # See SECURITY.md before enabling.
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-changeme-set-in-env-file}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - DATA_DIR=/app/data
      - BASE_URL=${BASE_URL:-http://localhost:3000}
      - REGISTRATION_OPEN=${REGISTRATION_OPEN:-true}
      - SCRAPER_URL=http://stationarr-epg:3000
      - SCRAPER_CHANNELS_PATH=/app/data/scraper/channels.xml
      - DOCKER_API_VERSION=1.41
    networks:
      - stationarr_net

  # ── iptv-org/epg scraper sidecar (optional) ──────────────────────
  # Uncomment to enable. Go to Settings → EPG Scraper to manage.
  #
  # epg:
  #   image: ghcr.io/iptv-org/epg:latest
  #   container_name: stationarr-epg
  #   restart: unless-stopped
  #   volumes:
  #     - scraper_shared:/epg/public
  #   environment:
  #     - CRON_SCHEDULE=0 */6 * * *
  #     - DAYS=3
  #     - MAX_CONNECTIONS=5
  #   networks:
  #     - stationarr_net

volumes:
  stationarr_data:
  scraper_shared:

networks:
  stationarr_net: